# After push to main, notify PEI ecosystem CI (in-mem + sim) with this commit SHA.
# Requires repo secret PEI_DISPATCH_PAT with repo scope on coti-io/pod-ecosystem-integration.

name: Dispatch PEI CI

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  dispatch-pei:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch PEI ecosystem CI
        env:
          PEI_DISPATCH_PAT: ${{ secrets.PEI_DISPATCH_PAT }}
        run: |
          if [ -z "$PEI_DISPATCH_PAT" ]; then
            echo "PEI_DISPATCH_PAT not set; skip repository_dispatch to pod-ecosystem-integration"
            exit 0
          fi
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $PEI_DISPATCH_PAT" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/coti-io/pod-ecosystem-integration/dispatches \
            -d "$(jq -nc \
              --arg sha "${{ github.sha }}" \
              --arg repo "${{ github.repository }}" \
              '{event_type:"pod-contracts-changed",client_payload:{repo:$repo,sha:$sha}}')"
